name: Build Desktop App (Windows & Linux)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sidecar_name: suhbatdosh-backend
            artifact_name: suhbatdosh-linux
          - os: windows-latest
            sidecar_name: suhbatdosh-backend.exe
            artifact_name: suhbatdosh-windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ffmpeg

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install frontend dependencies & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Python backend sidecar (PyInstaller)
        working-directory: backend
        run: |
          uv pip install --system --upgrade pip pyinstaller
          uv pip install --system .
          pyinstaller --noconfirm suhbatdosh-backend.spec

      - name: Copy sidecar binary into src-tauri
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp backend/dist/${{ matrix.sidecar_name }} src-tauri/${{ matrix.sidecar_name }}
          cp backend/dist/${{ matrix.sidecar_name }} src-tauri/binaries/${{ matrix.sidecar_name }}

      - name: Build Tauri Desktop App
        shell: bash
        run: |
          ./frontend/node_modules/.bin/tauri build

      - name: Upload Desktop Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
