[package]
name = "suhbatdosh"
version = "0.1.0"
description = "Suhbatdosh — AI Call Analytics & Live Voice Operator"
authors = ["Suhbatdosh"]
edition = "2021"

[lib]
name = "suhbatdosh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
