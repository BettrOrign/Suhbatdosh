[project]
name = "suhbatdosh-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.18.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "ffmpeg-python>=0.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.52.1",
    "python-telegram-bot>=21.0",
    "apscheduler>=3.10",
    "yt-dlp>=2025.1.1",
    # Offline STT for private mode (CPU only, no torch).
    # sherpa-onnx-core ships the native libsherpa-onnx/onnxruntime .so files
    # that the sherpa-onnx python wheel dlopen()s at import time.
    "sherpa-onnx>=1.10.0",
    "sherpa-onnx-core>=1.10.0",
    "soundfile>=0.12.1",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
